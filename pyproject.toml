[project]
name = "vacancy-hunter"
version = "0.1.0"
description = "AI Vacancy Hunter — личная система подбора IT-вакансий"
requires-python = ">=3.12"
dependencies = [
    "SQLAlchemy==2.0.36",
    "alembic==1.14.0",
    "psycopg[binary]==3.2.3",
    "pydantic==2.10.3",
    "PyYAML==6.0.2",
    "tzdata==2024.2",
    "httpx==0.28.1",
    "APScheduler==3.11.0",
    "aiogram==3.17.0",
    "anthropic==1.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers -p no:cacheprovider"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: тесты с настоящим PostgreSQL",
]
