# Словарь навыков (TECHNICAL_SPEC.md, раздел 6).
# canonical — одно имя навыка; LLM получает перечень канонических названий и возвращает навыки в этом виде.
# synonyms — варианты написания (регистр не важен). group — область раздела 5.2, «требует подтверждения»,
# «вне профиля» или «вне оценки» (не навык: язык учитывается фильтром «Язык», а не в стеке).
# related — смежность в одну сторону: «требуется этот навык → засчитывается 0,5 при наличии related в профиле».
# Изменение файла входит в версию профиля: новая версия и пересчёт оценок.

